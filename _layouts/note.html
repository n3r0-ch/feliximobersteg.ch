---
layout: default
---

<article>
  <div>
    <h1>{{ page.title }} <span aria-hidden="true">{{ page.title_icon }}</span></h1>
  </div>

  <div id="notes-entry-container">
    <content>
      {{ content }}
    </content>

    {% if page.backlinks.size > 0 %}
      <side style="font-size: 0.9em; padding-top: 1.2em" class="hide-in-print">
        <h3 style="margin-bottom: 0.9em; margin-block-start: 0">Siehe auch:</h3>
        <div style="display: grid; grid-gap: 1em; grid-template-columns: repeat(1fr);">
        {% for backlink in page.backlinks %}
          <div class="backlink-box">
          <a class="internal-link" href="{{ backlink.url }}{%- if site.use_html_extension -%}.html{%- endif -%}">{{ backlink.title }}</a><br>
          <div style="font-size: 0.9em">{{ backlink.excerpt | strip_html | truncatewords: 20 }}</div>
          </div>
        {% endfor %}
        </div>
      </side>
    {% endif %}
  </div>
</article>
