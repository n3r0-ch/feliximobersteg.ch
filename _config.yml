title:               Felix Imobersteg
include:
  - '_pages'
  - '_headers'
  - '_redirects'
exclude:
  - 'cspell.json'
  - '*.code-workspace'
  - 'LICENSE'
  - 'Makefile'
  - 'README.md'
url: https://feliximobersteg.ch # Used for SEO purposes

# If you are using a host that cannot resolve URLs that do
# not end with .html (such as Neocities), set this to 'true'.
use_html_extension:  false

# Set to `true` to open non-internal links in new tabs, or
# set to `false` to open non-internal links in current tab.
open_external_links_in_new_tab: true

permalink:            /:slug/
relative_permalinks: false

plugins:
  - jekyll-last-modified-at
  - jekyll-sitemap

kramdown:
  header_offset: 1

sass:
  sass_dir:          _sass
  style:            :compressed

collections:
  notes:
    output: true
    permalink: /:slug/

defaults:
  - scope:
      path: "**/*"
    values:
      layout: "default"
      show_cc_license: true
  - scope:
      path: "_notes/**/*.md"
    values:
      layout: "note"
  - scope:
      path: "_pages/**/*.md"
    values:
      layout: "page"
