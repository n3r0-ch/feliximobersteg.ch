name: Sync main branch to develop branch

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Git User
        run: |
          git config user.name "GitHub Action"
          git config user.email "github-action@feliximobersteg.ch"

      - name: Sync develop Branch
        run: |
          git checkout main
          git fetch origin
          git checkout develop
          git pull
          git merge origin/main
          git push origin develop
